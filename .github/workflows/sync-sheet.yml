name: Sinkron spreadsheet ke dashboard

on:
  schedule:
    - cron: "7 * * * *"   # setiap jam
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Panggil endpoint sinkron
        env:
          DASHBOARD_URL: ${{ secrets.DASHBOARD_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$DASHBOARD_URL" ]; then echo "DASHBOARD_URL belum diisi, lewati"; exit 0; fi
          curl -fsS --max-time 300 -H "Authorization: Bearer $CRON_SECRET" "$DASHBOARD_URL/api/cron/sync-sheet"
